# This is a REUSABLE workflow intended to be called by CONSUMING plugin
# repositories (e.g. JBlockGlitch). It is NOT used to publish this convention
# plugin itself — that is now handled by JitPack, which builds from git tags.
#
# Consuming repos reference it via:
#   uses: jruk8/plugin-conventions/.github/workflows/publish.yml@v1.0.0
#
# Design note: release tags are pushed by the developer and are NEVER rewritten
# by this workflow. The changelog is recorded on `main` as a separate, best-effort
# follow-up commit after the release has already been published, so a plain
# `git pull` is always enough — no `--force` fetching required.
name: Publish

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
        required: false

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      is_release: ${{ steps.tag-check.outputs.has_v_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Detect if this run is a tag push
        id: tag-check
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "has_v_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_v_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Compute current version (axion)
        id: version
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew -q -Prelease.quiet currentVersion | tail -n 1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ---------- Modrinth: only on real v* tags ----------
      - name: Publish to Modrinth
        if: ${{ vars.MODRINTH_ID != '' && steps.tag-check.outputs.has_v_tag == 'true' && !contains(github.ref_name, 'SNAPSHOT') }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          fail-mode: warn
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/!(*-plain|*-sources|*-dev).jar
          loaders: ${{ vars.MODRINTH_LOADERS }}
          game-versions: ${{ vars.MODRINTH_GAME_VERSIONS }}
          version: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          changelog: ${{ steps.changelog.outputs.content }}

      # ---------- GitHub release ----------
      # tag_name is exactly whatever the developer pushed. We never move it —
      # the release always points at the precise commit that was built.
      - name: Publish GitHub Release (full)
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          body: ${{ steps.changelog.outputs.content }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          draft: false

      # ---------- Snapshot cleanup on release ----------
      # If the latest release has no commits after it, the snapshot build is identical
      # to the release, so the snapshot pre-release is redundant and can be deleted.
      # This compares the tag's own (untouched) commit against main's tip, so it
      # reflects reality rather than something we manufactured by rewriting the tag.
      - name: Check if there are commits after the release tag
        id: release-tip-check
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --quiet

          tagged_commit="$(git rev-parse HEAD)"
          latest_main="$(git rev-parse origin/main)"

          if [ "$tagged_commit" = "$latest_main" ]; then
            echo "no_commits_after=true" >> "$GITHUB_OUTPUT"
            echo "Release tag is the latest commit on main; snapshot is identical to the release."
          else
            echo "no_commits_after=false" >> "$GITHUB_OUTPUT"
            echo "There are commits after the release tag; keeping the snapshot."
          fi

      - name: Delete snapshot release and tag (no commits after latest release)
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' && steps.release-tip-check.outputs.no_commits_after == 'true' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = "latest-snapshot";

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo }
            );

            const snapshotRelease = releases.find(
              release => release.tag_name === tagName
            );

            if (snapshotRelease) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: snapshotRelease.id
              });

              console.log("Deleted snapshot release:", snapshotRelease.id);
            } else {
              console.log("No snapshot release found; nothing to delete.");
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tagName}`
              });

              console.log(`Deleted tag: ${tagName}`);
            } catch (error) {
              if (error.status === 404 || (error.status === 422 && /does not exist/i.test(error.message))) {
                 console.log(`Tag not found; nothing to delete: ${tagName}`);
               } else {
                 throw error;
               }
            }

      - name: Delete previous snapshot release
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo }
            );

            const snapshotRelease = releases.find(r => r.tag_name === "latest-snapshot");
            if (snapshotRelease) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: snapshotRelease.id
              });
              console.log("Deleted previous snapshot release:", snapshotRelease.id);
            } else {
              console.log("No previous snapshot release found; nothing to delete.");
            }

      - name: Publish GitHub Pre-release (snapshot)
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          body: ${{ steps.changelog.outputs.content }}
          tag_name: latest-snapshot
          name: "v${{ steps.version.outputs.version }}"
          prerelease: true
          draft: false

  # Runs only after a real release has already been published above. Best-effort:
  # if this fails (e.g. branch protection on main), the release itself is unaffected.
  # Never touches any tag — just fast-forwards main with a normal commit.
  update-changelog:
    name: Record changelog on main
    needs: publish
    if: ${{ needs.publish.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: changelog-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --latest --prepend CHANGELOG.md
        env:
          OUTPUT: CHANGES.md

      - name: Commit CHANGELOG.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(changelog): update for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          else
            echo "CHANGELOG.md already up to date; nothing to commit."
          fi