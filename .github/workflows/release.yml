name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Detect if this commit has a v* tag
        id: tag-check
        shell: bash
        run: |
          set -euo pipefail
          if git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1; then
            echo "has_v_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_v_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          latest_v_tag="$(git tag --sort=-version:refname --list 'v*' | head -n 1 || true)"

          if [[ "${{ steps.tag-check.outputs.has_v_tag }}" == "true" ]]; then
            previous_tag="$(git tag --sort=-version:refname --list 'v*' | grep -Fxv "$current_tag" | grep -v -i 'SNAPSHOT' | head -n 1 || true)"
            if [ -n "$previous_tag" ]; then
              range="${previous_tag}..HEAD"
            else
              range="HEAD"
            fi
          else
            if [ -n "$latest_v_tag" ]; then
              range="${latest_v_tag}..HEAD"
            else
              range="HEAD"
            fi
          fi

          notes="$(git log --no-merges --pretty=format:'- %s' "$range" 2>/dev/null || true)"
          if [ -z "$notes" ]; then
            notes="- No commit messages available."
          fi

          delimiter="$(openssl rand -hex 8)"
          {
            echo "notes<<${delimiter}"
            echo "$notes"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute current version (axion)
        id: version
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew -q -Prelease.quiet currentVersion | tail -n 1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ---------- Publish to GitHub Packages ----------
      # Publishes the convention plugin (and its marker artifact) to the GitHub Packages
      # Maven registry.  On main pushes this is a snapshot version; on v* tags it is stable.
      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- GitHub release ----------
      - name: Publish GitHub Release (full)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.tag-check.outputs.has_v_tag == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelog.outputs.notes }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          prerelease: false
          draft: false

      # ---------- Snapshot cleanup on release ----------
      - name: Check if there are commits after the release tag
        id: release-tip-check
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          tagged_commit="$(git rev-parse HEAD)"
          latest_main="$(git rev-parse origin/main)"
          if [ "$tagged_commit" = "$latest_main" ]; then
            echo "no_commits_after=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_commits_after=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete snapshot release (no commits after latest release)
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' && steps.release-tip-check.outputs.no_commits_after == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo }
            );
            const snapshotRelease = releases.find(r => r.tag_name === "latest-snapshot");
            if (snapshotRelease) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: snapshotRelease.id
              });
              console.log("Deleted snapshot release:", snapshotRelease.id);
            } else {
              console.log("No snapshot release found; nothing to delete.");
            }

      - name: Delete previous snapshot release
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo }
            );
            const snapshotRelease = releases.find(r => r.tag_name === "latest-snapshot");
            if (snapshotRelease) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: snapshotRelease.id
              });
              console.log("Deleted previous snapshot release:", snapshotRelease.id);
            } else {
              console.log("No previous snapshot release found; nothing to delete.");
            }

      - name: Publish GitHub Pre-release (snapshot)
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelog.outputs.notes }}
          tag_name: latest-snapshot
          name: "v${{ steps.version.outputs.version }}"
          prerelease: true
          draft: false