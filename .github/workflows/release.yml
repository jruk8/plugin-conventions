name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/publish.yml
    with:
      java-version: '25'
    secrets: inherit