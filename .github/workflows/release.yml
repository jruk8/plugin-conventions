name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Detect if this commit has a v* tag
        id: tag-check
        shell: bash
        run: |
          set -euo pipefail
          if git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1; then
            echo "has_v_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_v_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Update CHANGELOG.md
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' }}
        uses: orhun/git-cliff-action@v4
        with:
        config: cliff.toml
        args: --tag ${{ github.ref_name }} --prepend CHANGELOG.md

      - name: Commit CHANGELOG.md
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(changelog): update for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main

      - name: Compute current version (axion)
        id: version
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew -q -Prelease.quiet currentVersion | tail -n 1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ---------- GitHub release ----------
      # JitPack builds artifacts on-demand from git tags, so there is no
      # separate publish step needed in this workflow. GitHub Releases are
      # still created for changelog visibility.
      - name: Publish GitHub Release (full)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.tag-check.outputs.has_v_tag == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelog.outputs.notes }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          draft: false

      # ---------- Snapshot cleanup on release ----------
      - name: Check if there are commits after the release tag
        id: release-tip-check
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          tagged_commit="$(git rev-parse HEAD)"
          latest_main="$(git rev-parse origin/main)"
          if [ "$tagged_commit" = "$latest_main" ]; then
            echo "no_commits_after=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_commits_after=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete snapshot release (no commits after latest release)
        if: ${{ steps.tag-check.outputs.has_v_tag == 'true' && steps.release-tip-check.outputs.no_commits_after == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo }
            );
            const snapshotRelease = releases.find(r => r.tag_name === "latest-snapshot");
            if (snapshotRelease) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: snapshotRelease.id
              });
              console.log("Deleted snapshot release:", snapshotRelease.id);
            } else {
              console.log("No snapshot release found; nothing to delete.");
            }

      - name: Delete previous snapshot release
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo }
            );
            const snapshotRelease = releases.find(r => r.tag_name === "latest-snapshot");
            if (snapshotRelease) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: snapshotRelease.id
              });
              console.log("Deleted previous snapshot release:", snapshotRelease.id);
            } else {
              console.log("No previous snapshot release found; nothing to delete.");
            }

      - name: Publish GitHub Pre-release (snapshot)
        if: ${{ github.ref == 'refs/heads/main' && steps.tag-check.outputs.has_v_tag == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelog.outputs.notes }}
          tag_name: latest-snapshot
          name: "v${{ steps.version.outputs.version }}"
          prerelease: true
          draft: false