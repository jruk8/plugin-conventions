plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'checkstyle'
    id 'maven-publish'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
}

group = 'com.github.jruk8'

scmVersion {
    tag {
        prefix = 'v'
        versionSeparator = ''
    }
    snapshotCreator { version, position -> /* unchanged */ }

    versionIncrementer { context ->
        String range = context.position.latestTag ? "${context.position.latestTag}..HEAD" : "HEAD"

        Process proc = ['git', 'log', '--no-merges', '--pretty=format:%s%n%b%n===END===', range]
                .execute(null, project.projectDir)
        proc.waitFor()
        String commits = proc.text

        boolean isMajor = commits =~ /(?m)^\w+(\([^)]*\))?!:/ || commits.contains('BREAKING CHANGE:') || commits.contains('BREAKING-CHANGE:')
        boolean isMinor = commits =~ /(?m)^feat(\([^)]*\))?:/
        boolean isPatch = commits =~ /(?m)^fix(\([^)]*\))?:/

        if (isMajor) {
            return context.currentVersion.incrementMajorVersion()
        } else if (isMinor) {
            return context.currentVersion.incrementMinorVersion()
        } else if (isPatch) {
            return context.currentVersion.incrementPatchVersion()
        } else {
            // no feat/fix/breaking commits since last tag — safe default
            return context.currentVersion.incrementPatchVersion()
        }
    }
}

def isWorkTreeDirty = {
    def process = ['git', 'status', '--porcelain'].execute(null, project.projectDir)
    process.waitFor()
    return process.text.trim().length() > 0
}

def isCiBuild = System.getenv('GITHUB_RUN_NUMBER') != null

project.version = scmVersion.version
if (!isCiBuild && isWorkTreeDirty() && !project.version.toString().contains('-SNAPSHOT')) {
    project.version = "${project.version}-SNAPSHOT"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.6.1'
    implementation 'pl.allegro.tech.build:axion-release-plugin:1.21.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

gradlePlugin {
    website = 'https://github.com/jruk8/plugin-conventions'
    vcsUrl = 'https://github.com/jruk8/plugin-conventions'
    plugins {
        pluginConventions {
            id = 'com.github.jruk8.plugin-conventions'
            implementationClass = 'com.jruk8.gradle.PluginConventionsPlugin'
            displayName = 'jruk8 Plugin Conventions'
            description = 'Shared Paper plugin conventions for jruk8 projects'
            tags = ['conventions', 'jruk8']
        }
    }
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('src/main/resources/checkstyle.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

check {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}