plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'checkstyle'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
}

group = 'com.jruk8'

scmVersion {
    tag {
        prefix = 'v'
        versionSeparator = ''
    }
    snapshotCreator { version, position ->
        def ciBuild = System.getenv('GITHUB_RUN_NUMBER')
        def suffix = ciBuild ?: ""
        return suffix ? ("-SNAPSHOT." + suffix) : "-SNAPSHOT"
    }
}

project.version = scmVersion.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.3.1'
    implementation 'pl.allegro.tech.build.axion-release:axion-release-plugin:1.21.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

gradlePlugin {
    plugins {
        pluginConventions {
            id = 'com.jruk8.plugin-conventions'
            implementationClass = 'com.jruk8.gradle.PluginConventionsPlugin'
        }
    }
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('src/main/resources/checkstyle.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

check {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jruk8/plugin-conventions')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: (project.findProperty('gpr.user') ?: '')
                password = System.getenv('GITHUB_TOKEN') ?: (project.findProperty('gpr.key') ?: '')
            }
        }
    }
}