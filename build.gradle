plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'checkstyle'
    id 'maven-publish'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
}

group = 'com.github.jruk8'

scmVersion {
    tag {
        prefix = 'v'
        versionSeparator = ''
    }
    snapshotCreator { version, position ->
        def ciBuild = System.getenv('GITHUB_RUN_NUMBER')
        def suffix = ciBuild ?: ""
        return suffix ? ("-SNAPSHOT." + suffix) : "-SNAPSHOT"
    }
}

project.version = scmVersion.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    compileOnly 'com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.6.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

gradlePlugin {
    website = 'https://github.com/jruk8/plugin-conventions'
    vcsUrl = 'https://github.com/jruk8/plugin-conventions'
    plugins {
        pluginConventions {
            id = 'io.github.jruk8.plugin-conventions'
            implementationClass = 'com.jruk8.gradle.PluginConventionsPlugin'
            displayName = 'jruk8 Plugin Conventions'
            description = 'Shared Paper plugin conventions for jruk8 projects'
            tags = ['conventions', 'jruk8']
        }
    }
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('src/main/resources/checkstyle.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

check {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}
